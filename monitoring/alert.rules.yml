groups:
- name: fraud-api-alerts
  rules:

  # --------------------------------------------------
  # Infrastructure Alerts
  # --------------------------------------------------

  - alert: FraudAPIDown
    expr: up{job="fraud_api"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Fraud API Down"
      description: "Fraud detection API has been unreachable for more than 1 minute."

  - alert: HighContainerCPU
    expr: rate(container_cpu_usage_seconds_total{name=~".*fraud-api.*"}[1m]) > 0.8
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High Fraud API CPU usage"
      description: "Fraud API container CPU usage exceeded 80% for more than 2 minutes."

  - alert: HighContainerMemory
    expr: container_memory_usage_bytes{name=~".*fraud-api.*"} > 800000000
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High Fraud API Memory usage"
      description: "Fraud API container memory usage exceeded 800MB for more than 2 minutes."


  # --------------------------------------------------
  # Model Performance Alerts
  # --------------------------------------------------

  - alert: HighPredictionLatencyP95
    expr: histogram_quantile(
            0.95,
            sum by (le) (
              rate(prediction_latency_seconds_bucket[5m])
            )
          ) > 0.2
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High Prediction Latency (P95)"
      description: "95% of fraud predictions exceeded 200ms latency over the last 5 minutes."


  # --------------------------------------------------
  # API Reliability Alerts
  # --------------------------------------------------

  - alert: HighFraudAPIErrorRate
    expr: (
            sum(rate(http_requests_total{job="fraud_api", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="fraud_api"}[5m]))
          ) > 0.05
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High Fraud API Error Rate"
      description: "5xx error rate exceeded 5% over the last 5 minutes."


  # --------------------------------------------------
  # Business Risk Alerts
  # --------------------------------------------------

  - alert: HighMerchantChargebackRate
    expr: fraud_merchant_chargeback_rate > 0.03
          AND fraud_merchant_total_transactions > 100
    for: 15m
    labels:
      severity: high
    annotations:
      summary: "High Merchant Chargeback Rate"
      description: "Merchant chargeback rate exceeded 3% with more than 100 transactions for 15 minutes."

  - alert: HighBINFailureRate
    expr: fraud_bin_failure_rate > 0.10
          AND fraud_bin_total_transactions > 300
    for: 15m
    labels:
      severity: medium
    annotations:
      summary: "High BIN Failure Rate"
      description: "BIN failure rate exceeded 10% with more than 100 transactions for 15 minutes."


  - alert: LowFraudAPIAvailability
    expr: 100 *
          (
            1 -
            (
              sum(increase(http_requests_total{job="fraud_api", status=~"5.."}[5m]))
                OR vector(0)
              /
              clamp_min(sum(increase(http_requests_total{job="fraud_api"}[5m])), 1)
            )
          ) < 99
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Fraud API availability dropped below 99%"
      description: "Availability SLO violated for more than 2 minutes."

  - alert: ModelDriftDetected
    expr: rate(drift_events_total[5m]) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Model drift detected"
      description: "Drift events detected in the last 5 minutes."

  - alert: HighErrorBudgetBurnRate
    expr: (
            (
              sum(rate(http_requests_total{job="fraud_api", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="fraud_api"}[5m]))
            )
            / 0.01
          ) > 2
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High Error Budget Burn Rate"
      description: "Error budget is being consumed at more than 2x the allowed rate."

  - alert: RetrainingTriggered
    expr: increase(model_retraining_total[5m]) > 0
    for: 1m
    labels:
      severity: info
    annotations:
      summary: "Model retraining triggered"
      description: "A retraining job was executed in the last 5 minutes."