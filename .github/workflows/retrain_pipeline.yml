name: Retraining Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Dataset
        run: |
          mkdir -p data/processed
          wget https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv -O data/processed/creditcard_v1_processed.csv

      - name: Run Retraining Pipeline
        run: |
          python -m retraining.retrain candidate